display_name: TradeCat Public
short_description: Operate and maintain the bundled TradeCat public terminal project.
default_prompt: "Use the TradeCat public skill to inspect, validate, or modify the bundled cache-first CLI/TUI project under project."
manifest: agents/manifest.json
skill_package_governance: references/skill-package-governance.md
agent_contract: references/agent-contract.md
hermes_agent_guide: references/hermes-agent-guide.md
default_workdir: .
project_root: project
role_profiles:
  canonical_source: agents/manifest.json#agent_role_profiles
  default_paper_trader: discretionary_futures_trader
fast_path:
  - read agents/manifest.json
  - bash scripts/run-tradecat.sh status --json
  - bash scripts/run-tradecat.sh datasets --json
  - bash scripts/run-tradecat.sh path signal_flow --json
  - bash scripts/run-tradecat.sh analyze --json
  - bash scripts/run-tradecat.sh features --json
notes:
  - Treat manifest.json as the only canonical machine contract.
  - Treat this repository root as the Hermes Skill package; implementation details live under project/.
  - Use agent_role_profiles only as soft paper/watch research prompts, never as trading authorization.
  - Read references/hermes-agent-guide.md for development-vs-production boundaries and Agent-supplied market context.
  - Prefer readonly commands before sync/install/uninstall.
