name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Guard local-only files
        run: bash scripts/guard_public_local_files.sh
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: PYTHONPATH=src pytest -q
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh scripts/start.sh scripts/watchdog.sh scripts/verify.sh scripts/guard_public_local_files.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content install.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content uninstall.ps1 -Raw)) | Out-Null
