repos:
  - repo: local
    hooks:
      - id: tradecat-skill-strict
        name: TradeCat skill strict validation
        entry: bash scripts/validate-skill.sh --strict
        language: system
        pass_filenames: false
      - id: tradecat-root-boundary
        name: TradeCat root boundary guard
        entry: bash scripts/guard_public_local_files.sh
        language: system
        pass_filenames: false
      - id: tradecat-shell-syntax
        name: TradeCat shell syntax
        entry: bash -n scripts/validate-skill.sh scripts/verify.sh scripts/verify-project.sh scripts/run-tradecat.sh scripts/agent-smoke.sh scripts/security-scan.sh scripts/bootstrap-dev.sh scripts/supply-chain-audit.sh scripts/install-security-tools.sh scripts/clean-local-runtime.sh install.sh uninstall.sh scripts/start.sh scripts/watchdog.sh scripts/guard_public_local_files.sh skills/tradecat-public/scripts/run-tradecat.sh skills/tradecat-public/scripts/validate-skill.sh
        language: system
        pass_filenames: false
      - id: tradecat-agent-smoke
        name: TradeCat agent readiness smoke
        entry: bash scripts/agent-smoke.sh
        language: system
        pass_filenames: false
      - id: tradecat-data-contract
        name: TradeCat registry contract
        entry: bash -c 'PYTHONPATH=src python scripts/validate_data_contract.py'
        language: system
        pass_filenames: false
