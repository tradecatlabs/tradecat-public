display_name: TradeCat Public
short_description: Operate and maintain the bundled TradeCat public terminal project.
default_prompt: "Use the TradeCat public skill to inspect, validate, or modify the repository-root cache-first CLI/TUI project."
manifest: skills/tradecat-public/agents/manifest.json
skill_package_governance: skills/tradecat-public/references/skill-package-governance.md
agent_contract: skills/tradecat-public/references/agent-contract.md
hermes_agent_guide: skills/tradecat-public/references/hermes-agent-guide.md
default_workdir: .
project_root: .
role_profiles:
  canonical_source: skills/tradecat-public/agents/manifest.json#agent_role_profiles
  default_paper_trader: discretionary_futures_trader
fast_path:
  - read skills/tradecat-public/agents/manifest.json
  - bash scripts/run-tradecat.sh status --json
  - bash scripts/run-tradecat.sh datasets --json
  - bash scripts/run-tradecat.sh path signal_flow --json
  - bash scripts/run-tradecat.sh analyze --json
  - bash scripts/run-tradecat.sh features --json
notes:
  - Treat manifest.json as the only canonical machine contract.
  - Treat skills/tradecat-public as the embedded Hermes Skill package; implementation details live at repository root.
  - Use agent_role_profiles only as soft paper/watch research prompts, never as trading authorization.
  - Read skills/tradecat-public/references/hermes-agent-guide.md for development-vs-production boundaries and Agent-supplied market context.
  - Prefer readonly commands before sync/install/uninstall.
